# Blueprint do Render: https://render.com/docs/blueprint-spec
# Cria a API (Docker) e o frontend (site estático). O banco e o storage ficam no Supabase.
# O deploy automático fica desligado: o workflow .github/workflows/deploy.yml roda as
# migrations no Supabase primeiro e só depois aciona os deploy hooks.

services:
  - type: web
    name: helpus-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./AccessControl/apps/api/Dockerfile
    dockerContext: ./AccessControl
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Pooler em modo transaction (porta 6543, ?pgbouncer=true) para o runtime.
      - key: DATABASE_URL
        sync: false
      # Declarada no datasource do schema.prisma; sem ela o Prisma Client falha ao
      # resolver o datasource na primeira query, e o health check passa a devolver 503.
      # Pooler em modo session (porta 5432).
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: student-photos

  - type: web
    name: helpus-web
    runtime: static
    rootDir: AccessControl
    buildCommand: npm ci && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    autoDeploy: false
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
