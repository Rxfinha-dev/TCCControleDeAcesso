name: Release

# Criar uma versão: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AccessControl/package-lock.json

      - name: Testes e build
        working-directory: AccessControl
        run: |
          npm ci
          npm test
          npm run build

      - name: Empacotar frontend
        working-directory: AccessControl/apps/web
        run: tar -czf "$GITHUB_WORKSPACE/helpus-web-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem (minúsculo)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"

      - name: Publicar imagem da API no GHCR
        uses: docker/build-push-action@v7
        with:
          context: AccessControl
          file: AccessControl/apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "helpus-web-${GITHUB_REF_NAME}.tar.gz" \
            --title "HelpUs $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Imagem da API: \`${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}\`"
